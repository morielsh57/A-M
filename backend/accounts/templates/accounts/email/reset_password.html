<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; color: #252525; line-height: 1.5;">
    <h1 style="color: #6f2c91;">Reset your A&amp;M Fashion password</h1>
    <p>Hello {{ user.name }},</p>
    <p>We received a request to reset your password.</p>
    <p>
      <a href="{{ reset_url }}"
         style="display: inline-block; padding: 12px 20px; background: #6f2c91; color: #fff; text-decoration: none; border-radius: 4px;">
        Reset password
      </a>
    </p>
    <p>This link is valid for {{ valid_for }} and can be used only once.</p>
    <p>If you did not request a password reset, you can safely ignore this email.</p>
  </body>
</html>
