<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f3f5;font-family:Arial,sans-serif;color:#2c2028">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:12px;padding:36px">
            <tr><td style="font-size:28px;font-weight:bold;color:#9d174d">A&amp;M Fashion</td></tr>
            <tr><td style="padding-top:28px;font-size:20px;font-weight:bold">Verify your email address</td></tr>
            <tr><td style="padding-top:14px;line-height:1.6">Hello {{ user.name }},</td></tr>
            <tr><td style="padding-top:8px;line-height:1.6">Thanks for joining A&amp;M Fashion. Confirm your email to activate your customer account.</td></tr>
            <tr>
              <td style="padding:28px 0">
                <a href="{{ verification_url }}" style="display:inline-block;background:#be185d;color:#fff;text-decoration:none;padding:13px 24px;border-radius:7px;font-weight:bold">Verify email</a>
              </td>
            </tr>
            <tr><td style="font-size:14px;line-height:1.5;color:#6b5963">This link is valid for {{ valid_for }} and can only be used once. If you did not create this account, ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
